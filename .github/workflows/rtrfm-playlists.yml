name: RTRFM Playlisty export

on:
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "Fetch even if the Sunday slot was already recorded"
        type: boolean
        default: true
  schedule:
    # 10:00am Sunday in Australia/Perth is 02:00 UTC.
    - cron: "0 2 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: rtrfm-playlists
  cancel-in-progress: false

env:
  TZ: Australia/Perth

jobs:
  fetch:
    name: Fetch RTRFM playlists
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore RTRFM runtime state
        uses: actions/cache@v4
        with:
          path: .github-rtrfm-state
          key: rtrfm-state-${{ github.run_id }}
          restore-keys: |
            rtrfm-state-

      - name: Prepare restored state
        run: |
          if [ -f .github-rtrfm-state/.rtrfm_state.json ]; then
            cp .github-rtrfm-state/.rtrfm_state.json .rtrfm_state.json
          fi

      - name: Fetch playlists
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.force_fetch }}" != "true" ]; then
            python rtrfm.py --scheduled
          else
            python rtrfm.py
          fi

      - name: Preserve RTRFM runtime state
        if: always()
        run: |
          mkdir -p .github-rtrfm-state
          if [ -f .rtrfm_state.json ]; then
            cp .rtrfm_state.json .github-rtrfm-state/.rtrfm_state.json
          fi

      - name: Upload Playlisty text files
        uses: actions/upload-artifact@v4
        with:
          name: playlisty-text
          path: |
            The Rounds - *.txt
            Jamdown Vershun - *.txt
          if-no-files-found: error

      - name: Commit updated playlist files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "The Rounds - "*.txt "Jamdown Vershun - "*.txt
          if git diff --cached --quiet; then
            echo "No playlist text changes to commit."
          else
            git commit -m "Update RTRFM Playlisty exports"
            git push
          fi
