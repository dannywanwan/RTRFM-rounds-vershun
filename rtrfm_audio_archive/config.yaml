name: RTRFM Audio Archive
version: 1.8.0
slug: rtrfm_audio_archive
description: Downloads and keeps The Rounds episodes in Home Assistant media storage.
url: https://github.com/dannywanwan/RTRFM-rounds-vershun
startup: services
boot: auto
init: false
arch:
  - aarch64
  - armv7
  - armhf
  - amd64
map:
  - type: media
    read_only: false
    path: /media
  - type: share
    read_only: false
    path: /share
  - type: addon_config
    read_only: false
    path: /config
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options:
  interval_hours: 24
  lookback_days: 35
schema:
  interval_hours: int
  lookback_days: int
